<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>International Simple English</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: calm two-person workspace. Left rail (bottom tabs on phones), sticky top bar with bell, one content column. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#1B2826; --muted:#5F6F6A; --faint:#8E9C97; --line:#DDE5E2;
  --accent:#2E7A6B; --accent-hover:#25675A; --accent-soft:#DCEEE8; --on-accent:#FFFFFF;
  --p-a:#4F63C6; --p-a-soft:#E4E7F8; --p-m:#B9603F; --p-m-soft:#F6E5DD;
  --u-low:#5E7F75; --u-low-bg:#E5EEEA; --u-med:#946A0C; --u-med-bg:#F5EBD2; --u-high:#B8592A; --u-high-bg:#F8E3D7; --u-urg:#B83636; --u-urg-bg:#F8DCDC;
  --danger:#B83636; --scrim:rgba(14,28,24,.34);
  --shadow:0 1px 2px rgba(20,44,38,.05),0 6px 20px rgba(20,44,38,.06);
  --shadow-lg:0 24px 64px rgba(20,44,38,.20);
  --r:18px; --gut:32px;
  --f-head:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#17211E; --surface-2:#1F2B28; --ink:#E2EBE8; --muted:#9AABA5; --faint:#6D7D78; --line:#293532;
  --accent:#6CC4AF; --accent-hover:#86D3C0; --accent-soft:#1C3530; --on-accent:#0D1A17;
  --p-a:#9AA6F2; --p-a-soft:#252A48; --p-m:#EE9F80; --p-m-soft:#3C2920;
  --u-low:#9DB7AE; --u-low-bg:#22302C; --u-med:#E4B85A; --u-med-bg:#382F19; --u-high:#F09B6C; --u-high-bg:#3B291E; --u-urg:#F08080; --u-urg-bg:#412426;
  --danger:#F08080; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 24px 64px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#17211E; --surface-2:#1F2B28; --ink:#E2EBE8; --muted:#9AABA5; --faint:#6D7D78; --line:#293532;
  --accent:#6CC4AF; --accent-hover:#86D3C0; --accent-soft:#1C3530; --on-accent:#0D1A17;
  --p-a:#9AA6F2; --p-a-soft:#252A48; --p-m:#EE9F80; --p-m-soft:#3C2920;
  --u-low:#9DB7AE; --u-low-bg:#22302C; --u-med:#E4B85A; --u-med-bg:#382F19; --u-high:#F09B6C; --u-high-bg:#3B291E; --u-urg:#F08080; --u-urg-bg:#412426;
  --danger:#F08080; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 24px 64px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:26px;font-weight:800}
.ic{width:18px;height:18px;flex:none}
.grow{flex:1}
.muted{color:var(--muted)}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--surface-2)}
.btn.ghost:hover{background:var(--line)}
.btn.red{background:var(--danger);color:var(--surface)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn[disabled]{opacity:.6;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link{color:var(--accent);font-weight:700;font-size:13px}
.link:hover{text-decoration:underline}
.in{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.in{resize:vertical;line-height:1.55}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in::placeholder,textarea::placeholder,input::placeholder{color:var(--faint)}
.field{display:grid;gap:7px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 10px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.udot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.seg.urg button.on.u-low{color:var(--u-low)} .seg.urg button.on.u-medium{color:var(--u-med)} .seg.urg button.on.u-high{color:var(--u-high)} .seg.urg button.on.u-urgent{color:var(--u-urg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--surface-2) var(--p,0%));margin:10px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:var(--shadow);cursor:grab}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:grab}

/* ---------- avatars & pills ---------- */
.av{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font:800 12px/1 var(--f-head);flex:none;letter-spacing:.02em}
.av.sm{--s:26px;font-size:10px}.av.xs{--s:20px;font-size:9px}.av.lg{--s:52px;font-size:17px}
.av-aarjit{background:var(--p-a-soft);color:var(--p-a)}
.av-mo{background:var(--p-m-soft);color:var(--p-m)}
.av-x{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.u-low{color:var(--u-low);background:var(--u-low-bg)} .u-medium{color:var(--u-med);background:var(--u-med-bg)}
.u-high{color:var(--u-high);background:var(--u-high-bg)} .u-urgent{color:var(--u-urg);background:var(--u-urg-bg)}
.seg.urg button{background:transparent}
.seg.urg button.on{background:var(--surface)}
.mark{width:40px;height:40px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center;font:800 13px/1 var(--f-head);letter-spacing:.06em;flex:none}
.mark.sm{width:32px;height:32px;border-radius:10px;font-size:11px}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(60% 50% at 20% 10%,var(--accent-soft),transparent 70%),radial-gradient(50% 50% at 90% 90%,var(--p-a-soft),transparent 70%),var(--bg)}
.lcard{width:100%;max-width:410px;background:var(--surface);border-radius:28px;padding:32px 28px 28px;box-shadow:var(--shadow-lg);display:grid;gap:22px}
.lcard h1{font-size:24px;line-height:1.2}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtn{display:grid;justify-items:center;gap:10px;padding:18px 8px 16px;border-radius:18px;border:1.5px solid var(--line);font-weight:700;transition:border-color .15s,background .15s}
.whobtn:hover{border-color:var(--faint)}
.whobtn.on{border-color:var(--accent);background:var(--accent-soft)}
.lerr{color:var(--danger);font-size:13px;margin:0;min-height:20px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 18px}
.brand b{font:800 15px/1.25 var(--f-head);letter-spacing:-.01em}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:13px;color:var(--muted);font-weight:700;font-size:14.5px;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:800 11px/20px var(--f-head);text-align:center}
.side-foot{margin-top:auto;display:grid;gap:10px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.live i{background:var(--accent)} .sync.warn i{background:var(--u-med)} .sync.bad i{background:var(--danger)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--surface-2)}
.me .mename{display:grid;line-height:1.25;min-width:0;flex:1}
.me .mename b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mename span{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.pad{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px;background:var(--bg)}
.top .ttl{display:grid;line-height:1.2;min-width:0;flex:1}
.top h2{font-size:15px;font-weight:800}
.top .ttl span{font-size:12.5px}
.bell{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:color .15s}
.bell:hover,.bell.on{color:var(--ink)}
.bell .ic{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--surface);font:800 11px/19px var(--f-head);text-align:center;border:2px solid var(--bg)}
.only-m{display:none}
.bannerwrap:empty{display:none}
.bannerwrap{padding-bottom:6px}
.banner{max-width:1016px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);animation:drop .35s ease}
.banner .btext{flex:1;min-width:0;font-size:14px}
.banner .bsnip{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bact{display:flex;align-items:center;gap:6px;flex:none}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
.view{width:100%;max-width:1080px;margin:0 auto;padding-top:10px;padding-bottom:56px;display:grid;gap:18px;align-content:start}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted);transition:all .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:48px 20px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty .eic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty .eic .ic{width:24px;height:24px}
.empty b{color:var(--ink);font:700 16px var(--f-head)}
.empty p{margin:0;max-width:40ch;font-size:14px}
.loading{padding:32px;text-align:center;color:var(--muted)}
.tabbar{display:none}

/* ---------- tasks ---------- */
.tlist{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.trow:hover{box-shadow:var(--shadow);border-color:transparent}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.check .ic{width:15px;height:15px;stroke-width:3}
.check:hover{border-color:var(--accent);color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tmain{flex:1;min-width:0;display:grid;gap:5px}
.ttitle{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.trow.done .ttitle{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tmeta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tmeta>span{display:inline-flex;align-items:center;gap:5px}
.tmeta .ic{width:14px;height:14px}
.due.over{color:var(--u-urg);font-weight:700} .due.soon{color:var(--u-high);font-weight:700}
.tside{display:flex;align-items:center;gap:10px;flex:none}
.bar{width:70px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pct{font-size:12.5px;font-weight:700;color:var(--muted);width:36px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- drawer / modal ---------- */
.overlay{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.dcard{position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow-lg);animation:slide .28s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;gap:6px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--line);min-height:64px}
.dhead .confirm{font-weight:700;font-size:14px}
.dscroll{flex:1;overflow:auto;padding:22px;display:grid;gap:22px;align-content:start}
.dtitle{font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.meta div{display:grid;gap:4px;min-width:0}
.meta dt{font-size:12px;font-weight:700;color:var(--muted)}
.meta dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.meta .due{font-size:12px}
.box{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--surface-2)}
.box .seg{background:var(--bg)}
.boxhead{display:flex;justify-content:space-between;align-items:center}
.boxhead b{font:800 18px var(--f-head);font-variant-numeric:tabular-nums}
.notestext{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.thread{display:grid;gap:14px}
.h3{font-size:15px;font-weight:800}
.cmts{display:grid;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cbody{flex:1;min-width:0;padding:10px 13px;border-radius:4px 16px 16px 16px;background:var(--surface-2)}
.cmt.mine .cbody{background:var(--accent-soft)}
.cmeta{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.cmeta b{color:var(--ink);font-size:13px}
.ctext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.empty-sm{margin:0;color:var(--muted);font-size:13.5px}
.composer{display:flex;gap:8px;align-items:flex-end}
.dcard .composer{padding:12px 16px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:160px;border-radius:21px;padding:10px 16px}
.composer .btn{width:42px;height:42px;padding:0}
.overlay.center{display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{position:relative;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);animation:pop .22s ease}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px 24px}
.mhead h2{font-size:20px}
.mbody{overflow:auto;padding:4px 24px 20px;display:grid;gap:18px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.title-in{font:700 17px var(--f-head);padding:12px 14px}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.nlist{padding:8px;display:grid;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100dvh - 120px);overflow:auto}
.nitem{display:grid;gap:3px;width:100%;text-align:left;padding:12px;border-radius:13px;transition:background .15s}
.nitem:hover{background:var(--surface-2)}
.nitem.on{background:var(--accent-soft)}
.nitem .nt{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;min-width:0}
.nitem .nt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .ns{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .nm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint)}
.neditor{padding:16px 26px 22px;display:grid;gap:10px;min-height:70vh;align-content:start;min-width:0}
.nebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:36px;font-size:12.5px;color:var(--muted)}
.save{font-weight:700;color:var(--accent)}
.ntitle{border:0;background:transparent;font:800 26px/1.25 var(--f-head);letter-spacing:-.015em;padding:4px 0;width:100%;outline:none}
.ntools{display:flex;gap:6px;flex-wrap:wrap}
.ntools button{height:28px;padding:0 11px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--muted)}
.ntools button:hover{color:var(--ink)}

<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG: paste your Google Apps Script web app address here.
   It looks like https://script.google.com/macros/s/AKfy.../exec

   in the Apps Script's Script Properties.
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxgRk5jgqwXsf7XI4pU_tfPZ6YqBETxcAmdBV1uSKkbA-q6g2PnjZh-9e2WcKgNCn5-Ug/exec';

/* ================= basics ================= */
const U = {
  aarjit:{name:'Aarjit', short:'Aarjit', ini:'A'},
  mo:{name:'Mo Riddiford', short:'Mo', ini:'MR'}

const other = k => k === 'aarjit' ? 'mo' : 'aarjit';
const URG = {low:'Low', medium:'Medium', high:'High', urgent:'Urgent'};
const URG_W = {urgent:0, high:1, medium:2, low:3};
const ST = {todo:'To do', doing:'In progress', done:'Done'};
const VIEWS = {tasks:['Tasks','tasks'], notes:['Meet notes','notes'], logs:['Work logs','logs'], links:['Links','link']};
const P = {
  tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  notes:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',

  link:'<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>',

  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18"/>'

const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const av = (k, size='') => U[k] ? `<span class="av av-${k} ${size}" title="${esc(U[k].name)}">${esc(U[k].ini)}</span>` : `<span class="av av-x ${size}">?</span>`;
const nm = k => U[k] ? U[k].short : 'Someone';
const urgKey = u => URG[u] ? u : 'medium';
const clampP = p => Math.max(0, Math.min(100, Math.round(Number(p) || 0)));
const wide = () => window.matchMedia('(min-width: 901px)').matches;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ================= dates ================= */
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseD(s){ if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function dayDiff(s){ const d = parseD(s); return d ? Math.round((d - parseD(today())) / 86400000) : null; }
function dueInfo(t){
  if (!t.due) return {txt:'No estimate', cls:''};
  if (t.status === 'done') return {txt:'Est. ' + fmtDate(t.due), cls:''};
  const n = dayDiff(t.due);
  if (n < 0) return {txt:`Overdue by ${-n}d`, cls:'over'};
  if (n === 0) return {txt:'Due today', cls:'soon'};
  if (n === 1) return {txt:'Due tomorrow', cls:'soon'};
  if (n < 7) return {txt:`Due in ${n} days`, cls:''};
  return {txt:'Due ' + fmtDate(t.due), cls:''};
}
function rel(ts){
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  const d = new Date(ts), y = new Date(); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}
function clock(ts){ return ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''; }
function dayLabel(s){
  const d = parseD(s); if (!d) return 'No date';
  const base = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'});
  const n = dayDiff(s);
  return n === 0 ? 'Today · ' + base : n === -1 ? 'Yesterday · ' + base : base;

/* ================= storage: Google Sheets through an Apps Script web app ================= */
let syncState = 'connecting';
const configured = /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
const COLS = ['tasks', 'notes', 'logs', 'links', 'feed'];
const NUM_F = new Set(['progress', 'hours', 'at', 'createdAt', 'updatedAt', 'seenAt']);
const JSON_F = new Set(['comments', 'events', 'readIds']);
async function api(action, payload){
  // A plain-text POST keeps this a "simple" request, so Apps Script needs no CORS preflight.
  const body = JSON.stringify(Object.assign({action, token:lsGet('ise:token') || ''}, payload || {}));

  const o = {};

const Store = {
  cache:{}, subs:{}, version:null, timer:null, busy:false, again:false, pending:0,

  _list(col){ const m = this.cache[col] || {}; return Object.keys(m).map(id => Object.assign({}, m[id])); },
  _emit(col){ (this.subs[col] || []).forEach(cb => cb(this._list(col))); },

    if (clean) delete clean.id;

  if (c === 'too_large') return 'That is too long for one Google Sheets cell. Split it into two.';

/* ================= state ================= */
let me = null, view = 'tasks';
const data = {tasks:[], notes:[], logs:[], links:[], feed:[]};
const loaded = {};

let openTaskId = null, activeNoteId = null, pendingNote = null, confirmKey = null, panelKind = null;
let dragging = false, loginWho = null;
const openThreads = new Set();

/* ================= notifications (each person writes only their own feed doc) ================= */
let pendingFeed = null;
function feedOf(k){ const f = data.feed.find(x => x.id === k) || {}; return {events:f.events || [], readIds:f.readIds || [], seenAt:f.seenAt || 0}; }

function writeFeed(mut){
  if (!me) return;
  const cur = myFeed();

/* ================= links ================= */
function linkKind(u){
  let h = '', p = '';
  try { const x = new URL(u); h = x.hostname.replace(/^www\./, ''); p = x.pathname; } catch(e){}
  if (h === 'docs.google.com'){
    if (p.startsWith('/document')) return ['doc', 'Doc', 'Google Doc'];
    if (p.startsWith('/spreadsheets')) return ['sheet', 'Sheet', 'Google Sheet'];
    if (p.startsWith('/presentation')) return ['slides', 'Slides', 'Google Slides'];
    if (p.startsWith('/forms')) return ['form', 'Form', 'Google Form'];
  }
  if (h === 'forms.gle') return ['form', 'Form', 'Google Form'];
  if (h === 'drive.google.com') return ['drive', 'Drive', 'Google Drive'];
  if (h === 'meet.google.com') return ['meet', 'Meet', 'Google Meet'];
  return ['web', (h.split('.')[0] || 'web').slice(0, 4), h || 'Link'];
}

}

async function submitLink(){
  const err = $('#linkErr'); err.textContent = '';
  let u = $('#linkUrl').value.trim();
  if (!u){ err.textContent = 'Paste a link first.'; $('#linkUrl').focus(); return; }
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/^http:\/\//i, 'https://');
  let ok = false; try { const x = new URL(u); ok = x.protocol === 'https:' && x.hostname.includes('.'); } catch(e){}
  if (!ok){ err.textContent = "That doesn't look like a web address."; return; }
  const [, , label] = linkKind(u);
  const title = $('#linkTitle').value.trim() || label, note = $('#linkNote').value.trim(), id = uid();
  try {
    await Store.set('links', id, {url:u, title, note, by:me, at:Date.now()});
    if ($('#linkNotify').checked) notify('link_new', 'links', id, title, note);
    $('#linkUrl').value = ''; $('#linkTitle').value = ''; $('#linkNote').value = '';
    toast($('#linkNotify').checked ? `Saved. ${nm(other(me))} will see it at the top.` : 'Link saved');
  } catch(e){ err.textContent = errMsg(e); }
}

/* ================= shared actions ================= */
function titleOf(col, item){
  if (col === 'logs') return `work log · ${fmtDate(item.date)}`;
  return item.title || 'Untitled';
}
async function addComment(col, id, text, input){
  const item = data[col].find(x => x.id === id);
  if (!item){ toast('That item was deleted.'); return; }
  const c = {id:uid(), by:me, text, at:Date.now()};
  try {
    await Store.update(col, id, {comments:[...(item.comments || []), c]});
    if (input){ input.value = ''; input.style.height = ''; }
    notify('comment', col, id, titleOf(col, item), text);
    if (col === 'tasks'){ const sc = $('#dScroll'); if (sc) setTimeout(() => { sc.scrollTop = sc.scrollHeight; }, 60); }
  } catch(e){ toast(errMsg(e)); }
}
function go(col, ref){
  panelKind = null;
  const exists = (data[col] || []).some(x => x.id === ref);
  if (!exists){ toast('That item was deleted.'); schedule(); return; }
  if (col === 'tasks'){ if (view !== 'tasks') setView('tasks'); openTask(ref); }
  else if (col === 'notes'){ flushNote(); activeNoteId = ref; if (view !== 'notes') setView('notes'); else { mountNoteEditor(); refreshNotes(); } }
  else if (col === 'logs'){ openThreads.add(ref); logFilter = 'all'; if (view !== 'logs') setView('logs'); else refreshLogs(); flash('log-' + ref); }
  else if (col === 'links'){ if (view !== 'links') setView('links'); flash('link-' + ref); }
  schedule();
}
function flash(domId){
  setTimeout(() => { const el = document.getElementById(domId); if (!el) return; el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }, 80);
}
function insertAt(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const needNl = s > 0 && ta.value[s - 1] !== '\n';
  ta.focus(); ta.setRangeText((needNl ? '\n' : '') + text, s, e, 'end');
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (panelKind && !e.target.closest('#panel') && !(a && a.dataset.act === 'togglePanel')){
    panelKind = null; renderPanel(); if (!a) return;
  }
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, v = a.dataset.v;
  switch (act){
    case 'who': {
      loginWho = v; document.querySelectorAll('.whobtn').forEach(b => b.classList.toggle('on', b === a));
      $('#loginErr').textContent = ''; $('#pw').focus(); break;
    }
    case 'view': setView(v); break;
    case 'togglePanel': panelKind = panelKind === v ? null : v; renderPanel(); break;
    case 'markAll': markAllRead(); panelKind = null; toast('All caught up'); break;
    case 'openEvent': {
      const ev = feedOf(other(me)).events.find(x => x.id === id);
      if (ev){ markRead([ev.id]); go(ev.col, ev.ref); }
      break;
    }
    case 'logout': doLogout(); break;
    case 'newTask': openTaskForm(null); break;
    case 'editTask': openTaskForm(id); break;
    case 'taskFilter': taskFilter = v; refreshTasks(); break;
    case 'openTask': openTask(id); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'closeModal': closeModal(); break;
    case 'toggleDone': {
      const t = data.tasks.find(x => x.id === id);
      if (t) updateTaskProgress(id, t.status === 'done' ? 'doing' : 'done', t.status === 'done' ? pctForStatus('doing', 90) : 100);
      break;
    }
    case 'setStatus': { const t = data.tasks.find(x => x.id === openTaskId); if (t) updateTaskProgress(t.id, v, pctForStatus(v, clampP(t.progress))); break; }
    case 'seg': {
      const box = a.closest('[data-seg]'); box.dataset.value = v;
      box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === a));
      if (box.dataset.seg === 'status'){ const r = $('#fPct'), p = pctForStatus(v, clampP(r.value)); setRange(r, p); $('#fPctLab').textContent = p + '%'; }
      break;
    }
    case 'askDel': confirmKey = v; schedule(); break;
    case 'cancelDel': confirmKey = null; schedule(); break;
    case 'delTask': confirmKey = null; Store.remove('tasks', id).then(() => { closeDrawer(); toast('Task deleted'); }).catch(err => toast(errMsg(err))); break;
    case 'delNote':
      confirmKey = null; if (noteTimer){ clearTimeout(noteTimer); noteTimer = null; }
      Store.remove('notes', id).then(() => { activeNoteId = null; mountNoteEditor(); refreshNotes(); toast('Note deleted'); }).catch(err => toast(errMsg(err))); break;
    case 'delLog': confirmKey = null; Store.remove('logs', id).then(() => toast('Log deleted')).catch(err => toast(errMsg(err))); break;
    case 'delLink': confirmKey = null; Store.remove('links', id).then(() => toast('Link removed')).catch(err => toast(errMsg(err))); break;
    case 'newNote': newNote(); break;
    case 'selectNote': selectNote(id); break;
    case 'noteBack': flushNote(); activeNoteId = null; mountNoteEditor(); refreshNotes(); break;
    case 'ins': {
      const b = $('#noteBody'); if (!b) break;
      const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      insertAt(b, v === 'action' ? '☐ ' : v === 'decision' ? '✓ Decision: ' : `[${t}] `);
      break;
    }
    case 'logFilter': logFilter = v; refreshLogs(); break;
    case 'toggleThread':
      if (openThreads.has(id)) openThreads.delete(id); else openThreads.add(id);
      refreshLogs();
      if (openThreads.has(id)) setTimeout(() => { const x = document.getElementById('lc-' + id); if (x) x.focus(); }, 20);
      break;
    case 'copyLink': {
      const l = data.links.find(x => x.id === id); if (!l) break;
      try { navigator.clipboard.writeText(l.url).then(() => toast('Link copied'), () => toast("Couldn't copy. Open the link and copy it from there.")); }
      catch(err){ toast("Couldn't copy. Open the link and copy it from there."); }
      break;
    }
  }
});

  const err = $('#loginErr'), pw = $('#pw').value.trim(), btn = $('#loginBtn');
  if (!configured){ err.textContent = 'Add your Apps Script web app address to index.html first (README.md, step 5).'; return; }
  if (!loginWho){ err.textContent = 'Choose your name first.'; return; }
  if (!pw){ err.textContent = 'Enter your password.'; $('#pw').focus(); return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
  try {
    const r = await api('login', {user:loginWho, pass:pw});
    lsSet('ise:token', r.token); lsSet('ise:me', loginWho);
    resetData(); me = loginWho; showScreen(); Store.start();
  } catch(e){
    err.textContent = ({
      bad_password:`That password doesn't match ${U[loginWho].short}'s. Try again.`,
      locked:'Too many wrong tries. Wait 15 minutes, then try again.',
      not_configured:'Passwords are not set in the Apps Script yet (README.md, step 3).',
      network:"Couldn't reach Google. Check your connection and the API_URL in index.html."
    })[e.code] || 'Something went wrong on the Google side. Try again in a moment.';
    $('#pw').select();
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}
function signOutLocal(){
  Store.stop(); lsDel('ise:token'); lsDel('ise:me');
  closeDrawer(); closeModal(); me = null; panelKind = null; resetData(); showScreen();
}
function doLogout(){
  flushNote();
  if (lsGet('ise:token')) api('logout').catch(() => {});
  signOutLocal();
}
function sessionEnded(){
  if (!me) return;
  signOutLocal();
  $('#loginErr').textContent = 'Your session ended. Please sign in again.';
}

/* ================= boot ================= */
(function boot(){
  const saved = lsGet('ise:me');
  me = U[saved] && lsGet('ise:token') ? saved : null;
  const sv = lsGet('ise:view'); if (VIEWS[sv]) view = sv;
  COLS.forEach(col => Store.watch(col, list => { data[col] = list; loaded[col] = true; schedule(); }));
  $('#setupNote').hidden = configured;
  showScreen();
  if (me) Store.start();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me) Store.poll(); });
  window.addEventListener('online', () => { if (me) Store.poll(); });
})();
})();
</script>
